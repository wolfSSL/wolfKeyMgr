name: wolfKeyMgr Nightly Build Workflow

on:
  schedule:
           # ┌───────────── minute (0 - 59)
           # │ ┌───────────── hour (0 - 23)
           # │ │ ┌───────────── day of the month (1 - 31)
           # │ │ │ ┌───────────── month (1 - 12)
           # │ │ │ │ ┌───────────── day of the week (0 - 6)
           # │ │ │ │ │
           # │ │ │ │ │
           # │ │ │ │ │
           # * * * * *
    - cron: '5 0 * * *'  # Run once per day at 5 AM

jobs:

  # Auto-resolve the latest wolfSSL -stable tag so nightly tracks releases
  # without a manual bump; refs = [ latest -stable, master ].
  resolve:
    uses: ./.github/workflows/_resolve-wolfssl.yml

  build_test:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        wolfssl-ref: ${{ fromJson(needs.resolve.outputs.refs) }}
    uses: ./.github/workflows/make-test.yml
    with:
      config-args:
      make-args:
      wolfssl-ref: ${{ matrix.wolfssl-ref }}
      config-name: default

  build_debug_test:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        wolfssl-ref: ${{ fromJson(needs.resolve.outputs.refs) }}
    uses: ./.github/workflows/make-test.yml
    with:
      config-args: --enable-debug
      make-args:
      wolfssl-ref: ${{ matrix.wolfssl-ref }}
      config-name: debug

  build_no_vault_test:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        wolfssl-ref: ${{ fromJson(needs.resolve.outputs.refs) }}
    uses: ./.github/workflows/make-test.yml
    with:
      config-args: --disable-vault
      make-args:
      wolfssl-ref: ${{ matrix.wolfssl-ref }}
      config-name: no-vault

  build_no_sniffer_test:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        wolfssl-ref: ${{ fromJson(needs.resolve.outputs.refs) }}
    uses: ./.github/workflows/make-test.yml
    with:
      config-args: --disable-sniffer
      make-args:
      wolfssl-ref: ${{ matrix.wolfssl-ref }}
      config-name: no-sniffer

  build_vault_clear_test:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        wolfssl-ref: ${{ fromJson(needs.resolve.outputs.refs) }}
    uses: ./.github/workflows/make-test.yml
    with:
      config-args: --enable-vault=clear
      make-args:
      wolfssl-ref: ${{ matrix.wolfssl-ref }}
      config-name: vault-clear

  build_minimal_test:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        wolfssl-ref: ${{ fromJson(needs.resolve.outputs.refs) }}
    uses: ./.github/workflows/make-test.yml
    with:
      config-args: --disable-sniffer --disable-vault
      make-args:
      wolfssl-ref: ${{ matrix.wolfssl-ref }}
      config-name: minimal
