name: wolfKeyMgr Nightly Build Workflow

on:
  schedule:
           # ┌───────────── minute (0 - 59)
           # │ ┌───────────── hour (0 - 23)
           # │ │ ┌───────────── day of the month (1 - 31)
           # │ │ │ ┌───────────── month (1 - 12)
           # │ │ │ │ ┌───────────── day of the week (0 - 6)
           # │ │ │ │ │
           # │ │ │ │ │
           # │ │ │ │ │
           # * * * * *
    - cron: '5 0 * * *'  # Run once per day at 5 AM

jobs:

  build_test:
    strategy:
      matrix:
        wolfssl-ref: [ master, v5.9.1-stable ]
    uses: ./.github/workflows/make-test.yml
    with:
      config-args:
      make-args:
      wolfssl-ref: ${{ matrix.wolfssl-ref }}

  build_debug_test:
    strategy:
      matrix:
        wolfssl-ref: [ master, v5.9.1-stable ]
    uses: ./.github/workflows/make-test.yml
    with:
      config-args: --enable-debug
      make-args:
      wolfssl-ref: ${{ matrix.wolfssl-ref }}

  build_no_vault_test:
    strategy:
      matrix:
        wolfssl-ref: [ master, v5.9.1-stable ]
    uses: ./.github/workflows/make-test.yml
    with:
      config-args: --disable-vault
      make-args:
      wolfssl-ref: ${{ matrix.wolfssl-ref }}
